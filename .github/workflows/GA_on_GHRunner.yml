name: Run GAs on Standard Github Hosted Runner

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]
    
jobs:
  build:
    runs-on: ubuntu-latest
    name: Run GAs on Linux Runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: 'testing'
    
      - name: Code Coverage Summary
        id: coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/cobertura.xml
          output: both
          badge: true
          format: markdown
          hide_complexity: true

      - name: Read Coverage Output
        id: read_coverage
        run: |
          # Read the output file generated by the action
          if [ -f code-coverage-results.md ]; then
          output=$(cat code-coverage-results.md)
          echo "coverage_output=$output" >> $GITHUB_ENV  # Set the output as an environment variable
          else
          echo "Coverage output file not found!"
          exit 1
          fi
          
