name: Run GAs on Standard Github Hosted Runner

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]
    
jobs:
  build:
    runs-on: ubuntu-latest
    name: Run GAs on Linux Runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: 'testing'
    
      - name: Code Coverage Summary
        id: coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/cobertura.xml
          output: file
          badge: true
          format: markdown
          hide_complexity: true

      - name: Read Coverage Output
        id: read_coverage
        run: |
          # Read the output file generated by the action
          if [ -f code-coverage-results.md ]; then
          badge_url=$(cat code-coverage-results.md | grep -oP '(?<=\!\[Code Coverage\]\().*?(?=\))')
          echo "$badge_url" # Set the output as an environment variable
          sed -i "s|\$badge_url|$badge_url|g" README.md  # Use '|' as delimiter to avoid issues with '/'
          else
          echo "Coverage output file not found!"
          exit 1
          fi
          
      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "Update README.md with coverage badge"
          git push
        env:  
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            

      
